{% extends "conferences/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h3 mb-3">Log in</h1>
    {% if form.errors %}<div class="alert alert-danger">Username or password didn't match.</div>{% endif %}
    <form method="post" class="card card-body">
      {% csrf_token %}
      <div class="mb-3"><label class="form-label" for="id_username">Username</label><input class="form-control" type="text" name="username" id="id_username" autofocus required></div>
      <div class="mb-3"><label class="form-label" for="id_password">Password</label><input class="form-control" type="password" name="password" id="id_password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
