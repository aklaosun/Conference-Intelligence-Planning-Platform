name: Version 0.4.0 QA verification
on:
  push:
    branches:
      - feature/shared-web-20261106-191806
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-web.lock.txt
      - name: Django regression tests
        env:
          DJANGO_SETTINGS_MODULE: ccse_platform.ai_local_settings
        run: python ccse-conference-platform/manage.py test conferences --noinput
      - name: Migration consistency
        env:
          DJANGO_SETTINGS_MODULE: ccse_platform.ai_local_settings
        run: python ccse-conference-platform/manage.py makemigrations --check --dry-run
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
